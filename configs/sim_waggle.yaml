# sim_waggle simulation configuration

simulation:
  fps: 200
  duration: 0  # 0: 无限循环，直到按下 Ctrl+C；>0: 指定运行秒数
  bullet_speed: 25.0              # 弹速 (m/s)，给弹道解算

my_robot:
  chassis_w: 12.0                  # 底盘小陀螺角速度 (rad/s)
  chassis_vx: 0.0                 # 底盘平移线速度 X (m/s)；碰到 x_range 反向
  chassis_vy: 0.0                 # 底盘平移线速度 Y (m/s)；碰到 y_range 反向
  gimbal_offset: [0.05, 0.0, 0.0] # 云台旋转中心相对底盘旋转中心的偏置 [dx, dy, dz] (m)
  x_range: [-1.5, 1.5]            # 底盘平动区间 [xmin, xmax] (m)
  y_range: [-1.5, 1.5]            # 底盘平动区间 [ymin, ymax] (m)

target_robot:
  init_pos: [3.5, 0.0, 0.0]       # 目标初始空间坐标 [x, y, z] (m)
  vel: [0.0, 0.0, 0.0]            # 目标平移速度 [vx, vy, vz] (m/s)；碰到区间反向
  x_range: [2.0, 5.0]             # 目标平动区间 [xmin, xmax] (m)
  y_range: [-1.5, 1.5]            # 目标平动区间 [ymin, ymax] (m)
  radius: 0.20                    # 对侧装甲半径 r，id 0/2 (m)
  l: 0.05                         # 邻侧半径增量：id 1/3 半径 = r+l (m)
  h: 0.05                         # 邻侧相对车心的 z 偏置 (m)
  w: 7.0                          # 目标自转角速度 (rad/s)
  armor_num: 4                    # 装甲板数量

measurement:
  enable_noise: true
  noise_pos_std: 0.005            # 观测位置噪声标准差 (m)
  noise_yaw_std: 0.01             # 观测装甲板角噪声标准差 (rad)
  noise_acc_std: 0.1              # 仿真 IMU xy 高斯噪声标准差 σ_u (m/s^2)；u = û + N(0, σ_u²)

aimer:
  yaw_offset: 0.0                 # 度，加到 atan2(y,x)
  pitch_offset: 0.0               # 度，加到弹道抬头角
  coming_angle: 55.0              # 度，小陀螺入板角
  leaving_angle: 20.0             # 度，小陀螺出板角
  delay_time: 0.0                 # s，仿真无 detector 墙钟，只外推飞行时间

ekf:
  q_xyz_acc_var: 10.0            # 未建模 z 加速度方差
  q_yaw_acc_var: 7.50             # 角加速度方差
  m_ax: 10.0                       # M 对角 ax 方差 (m/s^2)^2，应对齐 (noise_acc_std)²
  m_ay: 10.0                       # M 对角 ay 方差 (m/s^2)^2
  r_yaw: 0.04                     # yaw 观测噪声
  r_pitch: 0.04                   # pitch 观测噪声
  r_dist_base: 0.015              # 距离观测噪声基础值
  p0: [1, 64, 1, 64, 1, 64, 0.4, 400, 1.0e-5, 1, 1]

remote_logger:
  control_port: 15000
  beacon_port: 15999
  enable_remote: true
  enable_local: false
  log_dir: "./logs"
  var_buffer_size: 1024
  img_buffer_size: 10
  img_width: 800
  img_quality: 60
  heartbeat_interval_ms: 500
  sender_name: "sim_waggle"
  beacon_interval_ms: 1000
  head_timeout_ms: 2000
